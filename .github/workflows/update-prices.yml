name: Update Stock Prices

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: '対象銘柄のJSON文字列'
        required: true
        default: '[]'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run price update script
        env:
          STOCKS_DATA: ${{ github.event.inputs.stocks }}
        run: node update-prices.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update prices.json [skip ci]" && git push)
