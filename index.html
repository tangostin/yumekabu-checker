<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式ポートフォリオ管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

    <!-- ヘッダー -->
    <header class="bg-slate-800 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fa-solid font-bold fa-chart-line mr-2"></i>ポートフォリオ管理</h1>
            <button id="btn-fetch-all" onclick="fetchAllLatestQuotes()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center transition">
                <i id="icon-refresh" class="fa-solid fa-rotate mr-2"></i>一括更新
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- トースト通知 -->
        <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

        <!-- 資産サマリー -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <p class="text-xs text-gray-500 font-semibold">評価額合計</p>
                <p id="summary-total-val" class="text-2xl font-bold text-gray-900">¥0</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 font-semibold">取得金額合計</p>
                <p id="summary-total-cost" class="text-xl font-semibold text-gray-700">¥0</p>
            </div>
            <div>
                <p class="text-xs text-gray-500 font-semibold">評価損益</p>
                <p id="summary-total-profit" class="text-xl font-bold text-gray-500">¥0 (0.00%)</p>
            </div>
        </section>

        <!-- 銘柄追加フォーム -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-base font-bold mb-4 flex items-center"><i class="fa-solid fa-plus-circle mr-2 text-blue-600"></i>新規銘柄の追加</h2>
            <form id="add-stock-form" onsubmit="handleAddStock(event)" class="grid grid-cols-2 md:grid-cols-5 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">市場</label>
                    <select id="input-market" class="w-full border rounded p-2 text-sm bg-gray-50">
                        <option value="JP">日本株 (JP)</option>
                        <option value="US">米国株 (US)</option>
                        <option value="KR">韓国株 (KR)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">銘柄コード</label>
                    <input type="text" id="input-code" placeholder="例: 7203" required class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">保有株数</label>
                    <input type="number" step="any" id="input-shares" placeholder="100" required class="w-full border rounded p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">取得単価</label>
                    <input type="number" step="any" id="input-buy-price" placeholder="2000" required class="w-full border rounded p-2 text-sm">
                </div>
                <div class="col-span-2 md:col-span-1 flex items-end">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded text-sm transition">追加</button>
                </div>
            </form>
        </section>

        <!-- 保有銘柄一覧 -->
        <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-base font-bold flex items-center"><i class="fa-solid fa-list mr-2 text-gray-600"></i>保有銘柄一覧</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 text-gray-500 font-semibold border-b">
                        <tr>
                            <th class="p-3">銘柄</th>
                            <th class="p-3">保有数</th>
                            <th class="p-3">取得単価</th>
                            <th class="p-3">現在値</th>
                            <th class="p-3">評価額(円)</th>
                            <th class="p-3">損益(円)</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="holdings-table-body" class="divide-y divide-gray-100">
                        <!-- 動的生成 -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // ★ 設定項目（ご自身の情報に変更してください）
        // ==========================================
        const GITHUB_OWNER = 'tangostin'; // あなたのGitHubユーザー名
        const GITHUB_REPO = 'yumekabu-checker';       // あなたのリポジトリ名
        const WORKFLOW_FILE = 'update-prices.yml';

        // ==========================================
        // アプリ状態管理
        // ==========================================
        let appData = {
            holdings: []
        };

        // 初期化処理
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderApp();
        });

        function loadData() {
            const saved = localStorage.getItem('portfolio_app_data');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse local storage data');
                }
            }
        }

        function saveData() {
            localStorage.setItem('portfolio_app_data', JSON.stringify(appData));
        }

        // ==========================================
        // 銘柄の追加・削除
        // ==========================================
        function handleAddStock(e) {
            e.preventDefault();
            const market = document.getElementById('input-market').value;
            const code = document.getElementById('input-code').value.trim();
            const shares = parseFloat(document.getElementById('input-shares').value);
            const buyPrice = parseFloat(document.getElementById('input-buy-price').value);

            if (!code || isNaN(shares) || isNaN(buyPrice)) return;

            const newHolding = {
                id: Date.now().toString(),
                market,
                code,
                shares,
                buyPrice,
                curPrice: buyPrice, // 初期値は取得単価
                curFx: 1.0
            };

            appData.holdings.push(newHolding);
            saveData();
            renderApp();

            // フォームリセット
            document.getElementById('input-code').value = '';
            document.getElementById('input-shares').value = '';
            document.getElementById('input-buy-price').value = '';
            showToast('銘柄を追加しました');
        }

        function deleteHolding(id) {
            if (!confirm('この銘柄を削除しますか？')) return;
            appData.holdings = appData.holdings.filter(item => item.id !== id);
            saveData();
            renderApp();
            showToast('銘柄を削除しました');
        }

        // ==========================================
        // 画面描画
        // ==========================================
        function renderApp() {
            const tbody = document.getElementById('holdings-table-body');
            tbody.innerHTML = '';

            let totalVal = 0;
            let totalCost = 0;

            if (appData.holdings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">保有銘柄が登録されていません</td></tr>`;
            } else {
                appData.holdings.forEach(item => {
                    const fx = (item.market === 'JP') ? 1.0 : (item.curFx || 1.0);
                    const currentValJPY = item.shares * item.curPrice * fx;
                    const costValJPY = item.shares * item.buyPrice * fx;
                    const profitJPY = currentValJPY - costValJPY;
                    const profitRate = costValJPY > 0 ? (profitJPY / costValJPY) * 100 : 0;

                    totalVal += currentValJPY;
                    totalCost += costValJPY;

                    const profitClass = profitJPY >= 0 ? 'text-emerald-600' : 'text-rose-600';
                    const currencySymbol = item.market === 'US' ? '$' : (item.market === 'KR' ? '₩' : '¥');

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-3 font-semibold">
                            <span class="text-xs px-1.5 py-0.5 rounded mr-1 ${item.market === 'JP' ? 'bg-blue-100 text-blue-800' : (item.market === 'US' ? 'bg-green-100 text-green-800' : 'bg-purple-100 text-purple-800')}">${item.market}</span>
                            ${item.code}
                        </td>
                        <td class="p-3">${item.shares.toLocaleString()}</td>
                        <td class="p-3">${currencySymbol}${item.buyPrice.toLocaleString()}</td>
                        <td class="p-3">${currencySymbol}${item.curPrice.toLocaleString()}</td>
                        <td class="p-3 font-semibold">¥${Math.round(currentValJPY).toLocaleString()}</td>
                        <td class="p-3 font-semibold ${profitClass}">
                            ¥${Math.round(profitJPY).toLocaleString()}<br>
                            <span class="text-xs">(${profitRate >= 0 ? '+' : ''}${profitRate.toFixed(2)}%)</span>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteHolding('${item.id}')" class="text-gray-400 hover:text-rose-600 transition p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // サマリー計算
            const totalProfit = totalVal - totalCost;
            const totalProfitRate = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

            document.getElementById('summary-total-val').textContent = `¥${Math.round(totalVal).toLocaleString()}`;
            document.getElementById('summary-total-cost').textContent = `¥${Math.round(totalCost).toLocaleString()}`;
            
            const profitElem = document.getElementById('summary-total-profit');
            profitElem.textContent = `¥${Math.round(totalProfit).toLocaleString()} (${totalProfitRate >= 0 ? '+' : ''}${totalProfitRate.toFixed(2)}%)`;
            profitElem.className = `text-xl font-bold ${totalProfit >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
        }

        // ==========================================
        // GitHub Actions 連携 & 株価取得
        // ==========================================
        function getGithubToken() {
            let token = localStorage.getItem('gh_pat');
            if (!token) {
                token = prompt('GitHub Personal Access Tokenを入力してください（初回のみ）:');
                if (token) {
                    token = token.trim();
                    localStorage.setItem('gh_pat', token);
                }
            }
            return token;
        }

        async function triggerGitHubAction() {
            const token = getGithubToken();
            if (!token) throw new Error('トークンが入力されませんでした');

            const targetStocks = [];
            const seen = new Set();

            if (appData && appData.holdings && Array.isArray(appData.holdings)) {
                appData.holdings.forEach(item => {
                    const key = `${item.market}_${item.code}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        targetStocks.push({ code: item.code, market: item.market });
                    }
                });
            }

            if (targetStocks.length === 0) {
                throw new Error('更新対象の銘柄が登録されていません');
            }

            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github+json',
                    'Authorization': `Bearer ${token}`,
                    'X-GitHub-Api-Version': '2022-11-28'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: {
                        stocks: JSON.stringify(targetStocks)
                    }
                })
            });

            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem('gh_pat');
                throw new Error('トークンが無効または権限不足です。再度お試しください。');
            }

            if (!response.ok) {
                throw new Error(`Actions起動失敗 (Status: ${response.status})`);
            }
        }

        async function fetchAllLatestQuotes() {
            const btn = document.getElementById('btn-fetch-all');
            const icon = document.getElementById('icon-refresh');

            if (btn) btn.disabled = true;
            if (icon) icon.classList.add('fa-spin');

            try {
                let lastUpdatedAt = '';
                try {
                    const initRes = await fetch(`./prices.json?t=${Date.now()}`);
                    if (initRes.ok) {
                        const initData = await initRes.json();
                        lastUpdatedAt = initData.updatedAt || '';
                    }
                } catch (e) {
                    // prices.json が未作成の場合は無視
                }

                showToast('GitHub Actionsで株価更新を起動中...');

                await triggerGitHubAction();

                showToast('株価を取得中...（約20〜30秒かかります）');

                let updated = false;
                for (let i = 0; i < 12; i++) {
                    await new Promise(resolve => setTimeout(resolve, 5000));

                    const res = await fetch(`./prices.json?t=${Date.now()}`);
                    if (res.ok) {
                        const currentData = await res.json();
                        if (currentData.updatedAt && currentData.updatedAt !== lastUpdatedAt) {
                            applyPricesToApp(currentData);
                            updated = true;
                            showToast(`株価を更新しました（${new Date(currentData.updatedAt).toLocaleTimeString('ja-JP')}）`);
                            break;
                        }
                    }
                }

                if (!updated) {
                    showToast('更新確認がタイムアウトしました。数十秒後に再読み込みしてください。', 'warning');
                }

            } catch (err) {
                console.error(err);
                showToast(err.message || '株価の更新に失敗しました', 'error');
            } finally {
                if (btn) btn.disabled = false;
                if (icon) icon.classList.remove('fa-spin');
            }
        }

        function applyPricesToApp(data) {
            if (!appData || !appData.holdings) return;

            appData.holdings.forEach(stock => {
                const key = `${stock.market}_${stock.code}`;
                if (data.prices && data.prices[key] !== undefined && data.prices[key] !== null) {
                    stock.curPrice = data.prices[key];
                }
                if (stock.market === 'US' && data.fx?.USD) stock.curFx = data.fx.USD;
                if (stock.market === 'KR' && data.fx?.KRW) stock.curFx = data.fx.KRW;
            });

            saveData();
            renderApp();
        }

        // ==========================================
        // 簡易トーストUI
        // ==========================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast text-white text-sm px-4 py-3 rounded-lg shadow-lg pointer-events-auto flex items-center ${type === 'error' ? 'bg-rose-600' : (type === 'warning' ? 'bg-amber-600' : 'bg-slate-800')}`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
