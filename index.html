<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夢株</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Zen Kaku Gothic New"', '"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
        .tab-btn.active { border-color: #3b82f6; color: #60a5fa; background-color: rgba(30, 58, 138, 0.3); }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 selection:bg-blue-600 selection:text-white max-w-md mx-auto border-x border-slate-800 shadow-2xl">

    <!-- App Header Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/95 backdrop-blur sticky top-0 z-30 px-3 py-2.5">
        <div class="flex items-center justify-between gap-2">
            <!-- App Title -->
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
                    <i class="fa-solid fa-chart-line text-white text-sm"></i>
                </div>
                <h1 class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-300 bg-clip-text text-transparent whitespace-nowrap">
                    夢株
                </h1>
            </div>

            <!-- Top Action Buttons -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="fetchAllLatestQuotes()" id="btn-fetch-all" class="px-2.5 py-1.5 text-xs font-bold rounded-xl bg-blue-600 hover:bg-blue-500 text-white transition flex items-center gap-1 shadow-md shadow-blue-600/20 active:scale-95 whitespace-nowrap">
                    <i class="fa-solid fa-rotate text-xs transition-transform" id="icon-refresh"></i>
                    <span>一括更新</span>
                </button>
                <button onclick="openAddModal()" class="px-2.5 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white transition flex items-center gap-1 shadow-md shadow-emerald-600/20 active:scale-95 whitespace-nowrap">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>銘柄追加</span>
                </button>
                <button onclick="openBackupModal()" class="p-1.5 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition border border-slate-700 active:scale-95" title="保存/復元">
                    <i class="fa-solid fa-database px-1"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 w-full px-3 py-3 space-y-3 custom-scrollbar overflow-y-auto">

        <!-- Global Filter Bar -->
        <div class="flex items-center justify-between gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 shadow-md">
            <button onclick="setMarketFilter('ALL')" id="filter-market-ALL" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-center whitespace-nowrap">すべて</button>
            <button onclick="setMarketFilter('JP')" id="filter-market-JP" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-center whitespace-nowrap">🇯🇵 日本</button>
            <button onclick="setMarketFilter('US')" id="filter-market-US" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-center whitespace-nowrap">🇺🇸 米国</button>
            <button onclick="setMarketFilter('KR')" id="filter-market-KR" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition text-center whitespace-nowrap">🇰🇷 韓国</button>
        </div>

        <!-- Portfolio Summary Section -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl space-y-2.5">
            <!-- 保有株式 -->
            <div class="flex items-center justify-between bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80">
                <div class="font-extrabold text-sm text-blue-400 shrink-0 w-20 leading-snug">
                    保有株式
                </div>
                <div class="text-right text-xs sm:text-sm space-y-1 flex-1 pl-2 font-mono">
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">取得総額</span><span class="font-semibold text-slate-200" id="sum-h-cost">￥0</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">評価総額</span><span class="font-semibold text-white" id="sum-h-val">￥0</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">評価損益</span><span class="font-bold" id="sum-h-pl">￥0 (0.00%)</span></div>
                </div>
            </div>

            <!-- 売却株式 -->
            <div class="flex items-center justify-between bg-slate-950/80 p-2.5 rounded-xl border border-slate-800/80">
                <div class="font-extrabold text-sm text-indigo-300 shrink-0 w-20 leading-snug">
                    売却株式
                </div>
                <div class="text-right text-xs sm:text-sm space-y-1 flex-1 pl-2 font-mono">
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">取得総額</span><span class="font-semibold text-slate-200" id="sum-s-cost">￥0</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">売却総額</span><span class="font-semibold text-white" id="sum-s-val">￥0</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">評価損益</span><span class="font-bold" id="sum-s-pl">￥0 (0.00%)</span></div>
                </div>
            </div>

            <!-- 全株式 -->
            <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                <div class="font-extrabold text-sm text-emerald-400 shrink-0 w-20 leading-snug">
                    全株式
                </div>
                <div class="text-right text-xs sm:text-sm space-y-1 flex-1 pl-2 font-mono">
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">取得総額</span><span class="font-semibold text-slate-200" id="sum-a-cost">￥0</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">評価総額</span><span class="font-semibold text-white" id="sum-a-val">￥0</span></div>
                    <div class="flex justify-between items-center"><span class="text-slate-400 text-xs font-sans">評価損益</span><span class="font-bold" id="sum-a-pl">￥0 (0.00%)</span></div>
                </div>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <div class="flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-800">
            <button onclick="switchTab('holdings')" id="tab-btn-holdings" class="tab-btn active flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1 border border-transparent whitespace-nowrap">
                <i class="fa-solid fa-box-archive"></i>
                <span>保有一覧</span>
                <span id="badge-holdings-count" class="px-1.5 py-0.2 rounded-full text-[10px] bg-blue-950 text-blue-300 font-bold border border-blue-800">0</span>
            </button>
            <button onclick="switchTab('sold')" id="tab-btn-sold" class="tab-btn flex-1 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-slate-200 transition flex items-center justify-center gap-1 border border-transparent whitespace-nowrap">
                <i class="fa-solid fa-receipt"></i>
                <span>売却済み</span>
                <span id="badge-sold-count" class="px-1.5 py-0.2 rounded-full text-[10px] bg-slate-800 text-slate-300 font-bold border border-slate-700">0</span>
            </button>
        </div>

        <!-- SECTION 1: Holdings Stock List -->
        <section id="section-holdings" class="space-y-3">
            <div id="holdings-list-container" class="space-y-3"></div>
            <div id="holdings-empty" class="hidden p-8 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-2xl">
                <i class="fa-solid fa-folder-open text-3xl mb-2 opacity-40"></i>
                <p class="text-xs font-bold">保有銘柄がありません</p>
                <p class="text-[11px] mt-1 text-slate-400">「銘柄追加」ボタンから登録してください。</p>
            </div>
        </section>

        <!-- SECTION 2: Sold History List -->
        <section id="section-sold" class="space-y-3 hidden">
            <div id="sold-list-container" class="space-y-3"></div>
            <div id="sold-empty" class="hidden p-8 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-2xl">
                <i class="fa-solid fa-receipt text-3xl mb-2 opacity-40"></i>
                <p class="text-xs font-bold">売却データはありません</p>
            </div>
        </section>

    </main>

    <!-- MODAL 1: Add / Edit Stock Modal -->
    <div id="modal-stock" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-4 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white flex items-center gap-1.5" id="modal-stock-title">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> 銘柄の追加・編集
                </h3>
                <button onclick="closeModal('modal-stock')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="form-stock" onsubmit="handleStockSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="stock-id">

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">市場 <span class="text-rose-500">*</span></label>
                        <select id="stock-market" onchange="onMarketChange()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="JP">🇯🇵 日本 (JPY)</option>
                            <option value="US">🇺🇸 米国 (USD)</option>
                            <option value="KR">🇰🇷 韓国 (KRW)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">コード <span class="text-rose-500">*</span></label>
                        <input type="text" id="stock-code" required placeholder="1478, 7203, AAPL" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500 uppercase">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-400 font-semibold mb-1">銘柄名 <span class="text-rose-500">*</span></label>
                    <input type="text" id="stock-name" required placeholder="例: NEXT FUNDS 日本高配当株" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">取得日 <span class="text-rose-500">*</span></label>
                        <input type="date" id="stock-acq-date" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">保有株数 <span class="text-rose-500">*</span></label>
                        <input type="number" step="any" min="0.0001" id="stock-qty" required placeholder="100" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="p-2.5 bg-slate-950/60 rounded-xl border border-slate-800 space-y-2">
                    <div class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-1">取得時データ (単価・為替)</div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-400 text-[10px] mb-0.5">取得株価 (<span class="symbol-currency">JPY</span>)</label>
                            <input type="number" step="any" min="0" id="stock-acq-price" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] mb-0.5">取得為替 (対円)</label>
                            <input type="number" step="any" min="0" id="stock-acq-fx" required placeholder="1.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <div class="p-2.5 bg-slate-950/60 rounded-xl border border-slate-800 space-y-2">
                    <div class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-1">最新データ (現在株価・為替)</div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-slate-400 text-[10px] mb-0.5">現在株価 (<span class="symbol-currency">JPY</span>)</label>
                            <input type="number" step="any" min="0" id="stock-cur-price" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] mb-0.5">現在為替 (対円)</label>
                            <input type="number" step="any" min="0" id="stock-cur-fx" required placeholder="1.0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('modal-stock')" class="px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-semibold">キャンセル</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg bg-blue-600 text-white font-semibold shadow-md shadow-blue-600/20">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: Sell Modal -->
    <div id="modal-sell" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-4 shadow-2xl relative">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <div>
                    <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                        <i class="fa-solid fa-receipt text-emerald-400"></i> 株の売却
                    </h3>
                    <p class="text-xs text-slate-400 mt-0.5" id="sell-modal-stock-name">銘柄名</p>
                </div>
                <button onclick="closeModal('modal-sell')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="form-sell" onsubmit="handleSellSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="sell-stock-id">

                <div class="p-2 bg-blue-950/30 border border-blue-900/50 rounded-xl space-y-1">
                    <div class="flex justify-between text-slate-300">
                        <span>現在保有数:</span>
                        <span class="font-bold text-white" id="sell-current-qty">0</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">売却日 <span class="text-rose-500">*</span></label>
                        <input type="date" id="sell-date" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">売却株数 <span class="text-rose-500">*</span></label>
                        <input type="number" step="any" min="0.0001" id="sell-qty" required oninput="calculateSellPreview()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">売却単価 (<span id="sell-currency">JPY</span>) <span class="text-rose-500">*</span></label>
                        <input type="number" step="any" min="0" id="sell-price" required oninput="calculateSellPreview()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 font-semibold mb-1">売却時為替 (対円) <span class="text-rose-500">*</span></label>
                        <input type="number" step="any" min="0" id="sell-fx" required oninput="calculateSellPreview()" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="p-2.5 bg-slate-950 rounded-xl border border-slate-800 space-y-1 text-xs">
                    <div class="flex justify-between">
                        <span class="text-slate-400">売却総額:</span>
                        <span class="font-bold text-white font-mono" id="preview-sell-total-jpy">￥0</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">実現損益:</span>
                        <span class="font-bold font-mono" id="preview-sell-pl-jpy">￥0</span>
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('modal-sell')" class="px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-semibold">キャンセル</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg bg-emerald-600 text-white font-semibold shadow-md shadow-emerald-600/20">売却確定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 3: Backup / Restore Modal -->
    <div id="modal-backup" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-4 shadow-2xl relative">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-database text-indigo-400"></i> 保存と復元
                </h3>
                <button onclick="closeModal('modal-backup')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1.5">
                    <div class="font-bold text-white">バックアップ保存</div>
                    <button onclick="exportJSON()" class="w-full py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition">
                        JSONファイルを保存
                    </button>
                </div>

                <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1.5">
                    <div class="font-bold text-white">復元（ファイル読込）</div>
                    <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="importJSON(event)">
                    <button onclick="document.getElementById('json-file-input').click()" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold transition border border-slate-700">
                        ファイルを選択して復元
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 4: Confirm Modal -->
    <div id="modal-confirm" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-4 shadow-2xl relative text-center">
            <div class="w-10 h-10 rounded-full bg-rose-950 text-rose-500 flex items-center justify-center mx-auto mb-2 text-base">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 class="text-sm font-bold text-white mb-1" id="confirm-title">削除の確認</h4>
            <p class="text-xs text-slate-400 mb-4" id="confirm-message">このデータを削除しますか？</p>
            <div class="flex justify-center gap-2">
                <button onclick="closeModal('modal-confirm')" class="px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold">キャンセル</button>
                <button id="btn-confirm-action" class="px-4 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold shadow-md shadow-rose-600/20">削除</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-xs px-3 pointer-events-none space-y-2"></div>

    <script>
        // Global State Management
        const STORAGE_KEY = 'yumekabu_checker_data_v2';

        let appData = {
            holdings: [],
            soldHistory: []
        };

        let currentTab = 'holdings';
        let currentMarketFilter = 'ALL';

        // Sample initial seed data including ETF 1478
        const SAMPLE_DATA = {
            holdings: [
                {
                    id: 'h_1',
                    market: 'JP',
                    code: '1478',
                    name: 'iFreeETF 日本高配当株',
                    acqDate: '2023-05-15',
                    qty: 50,
                    acqPrice: 2800,

        function formatNumber(num, decimals = 2) {
            if (num === null || num === undefined || isNaN(num)) return '0';
            return new Intl.NumberFormat('ja-JP', {
                minimumFractionDigits: 0,
                maximumFractionDigits: decimals
            }).format(num);
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '';
            return dateStr.replace(/-/g, '/');
        }

        function formatJPY(num) {
            if (isNaN(num)) return '￥0';
            const val = Math.round(num);
            const prefix = val < 0 ? '-￥' : '￥';
            return prefix + Math.abs(val).toLocaleString('ja-JP');
        }

        function formatForeignSymbol(num, market) {
            if (isNaN(num)) return '0';
            const formatted = formatNumber(num, market === 'KR' ? 0 : 2);
            switch(market) {
                case 'US': return `$${formatted}`;
                case 'KR': return `₩${formatted}`;
                case 'JP': return `￥${formatted}`;
                default: return formatted;
            }
        }

        function formatPercent(num) {
            if (isNaN(num) || !isFinite(num)) return '0.00%';
            const prefix = num > 0 ? '+' : '';
            return `${prefix}${num.toFixed(2)}%`;
        }

        function getMarketCurrency(market) {
            switch(market) {
                case 'JP': return 'JPY';
                case 'US': return 'USD';
                case 'KR': return 'KRW';
                default: return 'JPY';
            }
        }

        function renderSummarySection() {
            const filteredHoldings = appData.holdings.filter(h => currentMarketFilter === 'ALL' || h.market === currentMarketFilter);
            const filteredSold = appData.soldHistory.filter(s => currentMarketFilter === 'ALL' || s.market === currentMarketFilter);

            let hCostJPY = 0, hValJPY = 0, hPlJPY = 0;
            filteredHoldings.forEach(item => {
                const costJ = calcCostJPY(item.acqPrice, item.qty, item.acqFx);
                const valJ = calcValueJPY(item.curPrice, item.qty, item.curFx);
                hCostJPY += costJ;
                hValJPY += valJ;
                hPlJPY += (valJ - costJ);
            });

            let sCostJPY = 0, sValJPY = 0, sPlJPY = 0;
            filteredSold.forEach(item => {
                const costJ = calcCostJPY(item.acqPrice, item.soldQty, item.acqFx);
                const valJ = calcValueJPY(item.sellPrice, item.soldQty, item.sellFx);
                sCostJPY += costJ;
                sValJPY += valJ;
                sPlJPY += (valJ - costJ);
            });

            const aCostJPY = hCostJPY + sCostJPY;
            const aValJPY = hValJPY + sValJPY;
            const aPlJPY = hPlJPY + sPlJPY;

            const hPct = hCostJPY > 0 ? (hPlJPY / hCostJPY) * 100 : 0;
            document.getElementById('sum-h-cost').innerText = formatJPY(hCostJPY);
            document.getElementById('sum-h-val').innerText = formatJPY(hValJPY);
            setPLStyle('sum-h-pl', hPlJPY, hPct);

            const sPct = sCostJPY > 0 ? (sPlJPY / sCostJPY) * 100 : 0;

            document.getElementById('sum-s-val').innerText = formatJPY(sValJPY);

            document.getElementById('sum-a-val').innerText = formatJPY(aValJPY);
            setPLStyle('sum-a-pl', aPlJPY, aPct);

                    btn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white transition text-center whitespace-nowrap shadow-md shadow-blue-600/20';
                } else {
                    btn.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition text-center whitespace-nowrap';
                }
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openAddModal() {
            document.getElementById('modal-stock-title').innerHTML = `<i class="fa-solid fa-plus text-emerald-400"></i> 保有銘柄の新規追加`;
            document.getElementById('form-stock').reset();
            document.getElementById('stock-id').value = '';
            document.getElementById('stock-market').value = 'JP';
            document.getElementById('stock-acq-date').value = new Date().toISOString().split('T')[0];
            onMarketChange();
            openModal('modal-stock');
        }

        function openEditModal(id) {
            const stock = appData.holdings.find(h => h.id === id);
            if (!stock) return;

            document.getElementById('modal-stock-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-400"></i> 銘柄情報の編集`;
            document.getElementById('stock-id').value = stock.id;
            document.getElementById('stock-market').value = stock.market;
            document.getElementById('stock-code').value = stock.code;
            document.getElementById('stock-name').value = stock.name;
            document.getElementById('stock-acq-date').value = stock.acqDate;
            document.getElementById('stock-qty').value = stock.qty;
            document.getElementById('stock-acq-price').value = stock.acqPrice;
            document.getElementById('stock-acq-fx').value = stock.acqFx;
            document.getElementById('stock-cur-price').value = stock.curPrice;
            document.getElementById('stock-cur-fx').value = stock.curFx;

            onMarketChange();
            openModal('modal-stock');
        }

        function onMarketChange() {
            const market = document.getElementById('stock-market').value;
            const currency = getMarketCurrency(market);

            document.querySelectorAll('.symbol-currency').forEach(el => el.innerText = currency);

            const acqFxInput = document.getElementById('stock-acq-fx');
            const curFxInput = document.getElementById('stock-cur-fx');

            if (market === 'JP') {
                acqFxInput.value = '1.0';
                curFxInput.value = '1.0';
                acqFxInput.readOnly = true;
                curFxInput.readOnly = true;
            } else {
                acqFxInput.readOnly = false;
                curFxInput.readOnly = false;
                if (market === 'US') {
                    if (acqFxInput.value === '1.0' || !acqFxInput.value) acqFxInput.value = '155.0';
                    if (curFxInput.value === '1.0' || !curFxInput.value) curFxInput.value = '155.0';
                } else if (market === 'KR') {
                    if (acqFxInput.value === '1.0' || !acqFxInput.value) acqFxInput.value = '0.11';
                    if (curFxInput.value === '1.0' || !curFxInput.value) curFxInput.value = '0.11';
                }
            }
        }

        function handleStockSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('stock-id').value;
            const market = document.getElementById('stock-market').value;
            const code = document.getElementById('stock-code').value.trim().toUpperCase();
            const name = document.getElementById('stock-name').value.trim();
            const acqDate = document.getElementById('stock-acq-date').value;
            const qty = parseFloat(document.getElementById('stock-qty').value);
            const acqPrice = parseFloat(document.getElementById('stock-acq-price').value);
            const acqFx = parseFloat(document.getElementById('stock-acq-fx').value);
            const curPrice = parseFloat(document.getElementById('stock-cur-price').value);
            const curFx = parseFloat(document.getElementById('stock-cur-fx').value);

            if (id) {
                const index = appData.holdings.findIndex(h => h.id === id);
                if (index !== -1) {
                    appData.holdings[index] = { id, market, code, name, acqDate, qty, acqPrice, acqFx, curPrice, curFx };
                    showToast('銘柄情報を更新しました');
                }
            } else {
                const newStock = {
                    id: 'h_' + Date.now(),
                    market, code, name, acqDate, qty, acqPrice, acqFx, curPrice, curFx
                };
                appData.holdings.unshift(newStock);
                showToast('銘柄を追加しました');
            }

            saveData();
            renderApp();
            closeModal('modal-stock');
        }

        function openSellModal(id) {
            const stock = appData.holdings.find(h => h.id === id);
            if (!stock) return;

            document.getElementById('sell-stock-id').value = stock.id;
            document.getElementById('sell-modal-stock-name').innerText = `${stock.name} (${stock.code})`;
            document.getElementById('sell-current-qty').innerText = formatNumber(stock.qty, 4) + '株';
            document.getElementById('sell-currency').innerText = getMarketCurrency(stock.market);

            document.getElementById('sell-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('sell-qty').value = stock.qty;
            document.getElementById('sell-price').value = stock.curPrice;
            document.getElementById('sell-fx').value = stock.curFx;

            calculateSellPreview();
            openModal('modal-sell');
        }

        function calculateSellPreview() {
            const stockId = document.getElementById('sell-stock-id').value;
            const stock = appData.holdings.find(h => h.id === stockId);
            if (!stock) return;

            const sellQty = parseFloat(document.getElementById('sell-qty').value) || 0;
            const sellPrice = parseFloat(document.getElementById('sell-price').value) || 0;
            const sellFx = parseFloat(document.getElementById('sell-fx').value) || 1.0;

            const sellTotalJPY = calcValueJPY(sellPrice, sellQty, sellFx);
            const acqCostJPY = calcCostJPY(stock.acqPrice, sellQty, stock.acqFx);
            const jpyPL = sellTotalJPY - acqCostJPY;

            document.getElementById('preview-sell-total-jpy').innerText = formatJPY(sellTotalJPY);
            const jpyEl = document.getElementById('preview-sell-pl-jpy');
            jpyEl.innerText = `${jpyPL >= 0 ? '+' : ''}${formatJPY(jpyPL)}`;
            jpyEl.className = jpyPL >= 0 ? 'font-bold text-emerald-400 font-mono' : 'font-bold text-rose-400 font-mono';
        }

        function handleSellSubmit(e) {
            e.preventDefault();
            const stockId = document.getElementById('sell-stock-id').value;
            const stockIndex = appData.holdings.findIndex(h => h.id === stockId);
            if (stockIndex === -1) return;

            const stock = appData.holdings[stockIndex];
            const sellDate = document.getElementById('sell-date').value;
            const soldQty = parseFloat(document.getElementById('sell-qty').value);
            const sellPrice = parseFloat(document.getElementById('sell-price').value);
            const sellFx = parseFloat(document.getElementById('sell-fx').value);

            if (soldQty <= 0 || soldQty > stock.qty) {
                showToast('売却株数が不正です', 'error');
                return;
            }

            const soldRecord = {
                id: 's_' + Date.now(),
                market: stock.market,
                code: stock.code,
                name: stock.name,
                acqDate: stock.acqDate,
                sellDate: sellDate,
                soldQty: soldQty,
                acqPrice: stock.acqPrice,
                acqFx: stock.acqFx,
                sellPrice: sellPrice,
                sellFx: sellFx
            };

            appData.soldHistory.unshift(soldRecord);

            if (Math.abs(stock.qty - soldQty) < 0.00001) {
                appData.holdings.splice(stockIndex, 1);
                showToast(`「${stock.name}」を全額売却しました`);
            } else {
                stock.qty -= soldQty;
                showToast(`「${stock.name}」を一部売却しました`);
            }

            saveData();
            renderApp();
            closeModal('modal-sell');
        }

        function confirmDeleteStock(id) {
            const stock = appData.holdings.find(h => h.id === id);
            if (!stock) return;

            document.getElementById('confirm-title').innerText = '保有銘柄の削除';
            document.getElementById('confirm-message').innerText = `「${stock.name}」を削除しますか？`;
            document.getElementById('btn-confirm-action').onclick = () => {
                appData.holdings = appData.holdings.filter(h => h.id !== id);
                saveData();
                renderApp();
                closeModal('modal-confirm');
                showToast('削除しました');
            };
            openModal('modal-confirm');
        }

        function confirmDeleteSold(id) {
            const sold = appData.soldHistory.find(s => s.id === id);
            if (!sold) return;

            document.getElementById('confirm-title').innerText = '売却履歴の削除';
            document.getElementById('confirm-message').innerText = `「${sold.name}」の売却履歴を削除しますか？`;
            document.getElementById('btn-confirm-action').onclick = () => {
                appData.soldHistory = appData.soldHistory.filter(s => s.id !== id);
                saveData();
                renderApp();
                closeModal('modal-confirm');
                showToast('削除しました');
            };
            openModal('modal-confirm');
        }

        async function fetchStockQuote(code, market) {
            let cleanCode = code.trim().toUpperCase();
            let yahooSymbol = cleanCode;

            if (market === 'JP') {
                if (!cleanCode.includes('.')) yahooSymbol = cleanCode + '.T';
            } else if (market === 'KR') {
                if (!cleanCode.includes('.')) yahooSymbol = cleanCode + '.KS';
            }

            // Source 1: Yahoo Finance Chart API with CORS Proxies & Fallbacks
            const yahooPrice = await fetchYahooQuote(yahooSymbol);
            if (yahooPrice !== null && yahooPrice > 0) return yahooPrice;

            // Source 2: Stooq API Fallback (Enhanced format mapping)
            let stooqSymbol = cleanCode.toLowerCase();
            if (market === 'JP') stooqSymbol += '.jp';
            else if (market === 'US') stooqSymbol += '.us';
            else if (market === 'KR') stooqSymbol += '.kr';

            const stooqPrice = await fetchStooqQuote(stooqSymbol);
            if (stooqPrice !== null && stooqPrice > 0) return stooqPrice;

            return null;
        }

        // Robust Yahoo Fetcher using multiple Yahoo Hosts + Multiple High-Speed CORS Proxies
        async function fetchYahooQuote(symbol) {
            const yahooHosts = [
                `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=5d`,
                `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=5d`
            ];

            const proxyGenerators = [
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                url => `https://corsproxy.org/?${encodeURIComponent(url)}`
            ];

            for (const targetUrl of yahooHosts) {
                for (const getProxyUrl of proxyGenerators) {
                    try {
                        const proxyUrl = getProxyUrl(targetUrl);
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3500); // Fast 3.5s timeout per attempt

                        const res = await fetch(proxyUrl, { signal: controller.signal });
                        clearTimeout(timeoutId);

                        if (res.ok) {
                            const data = await res.json();
                            const result = data?.chart?.result?.[0];
                            if (result) {
                                const meta = result.meta;
                                if (meta?.regularMarketPrice && meta.regularMarketPrice > 0) {
                                    return meta.regularMarketPrice;
                                }
                                if (meta?.chartPreviousClose && meta.chartPreviousClose > 0) {
                                    return meta.chartPreviousClose;
                                }
                                if (meta?.previousClose && meta.previousClose > 0) {
                                    return meta.previousClose;
                                }
                                const closes = result.indicators?.quote?.[0]?.close;
                                if (Array.isArray(closes)) {
                                    const validCloses = closes.filter(c => c !== null && c !== undefined && typeof c === 'number' && c > 0);
                                    if (validCloses.length > 0) return validCloses[validCloses.length - 1];
                                }
                            }
                        }
                    } catch (e) {
                        // Suppress timeout errors and try next proxy
                    }
                }
            }
            return null;
        }

        // Stooq API Backup Fetcher
        async function fetchStooqQuote(symbol) {
            const targetUrl = `https://stooq.com/q/l/?s=${encodeURIComponent(symbol)}&f=sdal212&e=json`;
            const proxyGenerators = [
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (const getProxyUrl of proxyGenerators) {
                try {
                    const proxyUrl = getProxyUrl(targetUrl);
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3500);

                    const res = await fetch(proxyUrl, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        const data = await res.json();
                        const item = data?.symbols?.[0];
                        if (item && item.close && typeof item.close === 'number' && item.close > 0) {
                            return item.close;
                        }
                    }
                } catch (e) {
                    // Try next fallback
                }
            }
            return null;
        }

        async function fetchAllLatestQuotes() {
            if (appData.holdings.length === 0) {
                showToast('保有銘柄が登録されていません', 'warning');
                return;
            }

            const btn = document.getElementById('btn-fetch-all');
            const icon = document.getElementById('icon-refresh');
            
            btn.disabled = true;
            icon.classList.add('fa-spin');

            showToast('為替および最新株価を取得中...');

            let fxMap = { 'JPY': 1.0 };

            try {
                const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
                if (fxRes.ok) {
                    const fxData = await fxRes.json();
                    if (fxData && fxData.rates) {
                        const usdJpy = fxData.rates.JPY;
                        const usdKrw = fxData.rates.KRW;
                        if (usdJpy) fxMap['USD'] = usdJpy;
                        if (usdJpy && usdKrw) fxMap['KR'] = usdJpy / usdKrw;
                    }
                }
            } catch (err) {
                console.warn('FX API Error:', err);
            }

            let updatedCount = 0;
            let total = appData.holdings.length;

            for (let i = 0; i < total; i++) {
                let stock = appData.holdings[i];
                showToast(`株価更新中 (${i + 1}/${total}): ${stock.name}...`);

                if (stock.market === 'US' && fxMap['USD']) stock.curFx = fxMap['USD'];
                if (stock.market === 'KR' && fxMap['KR']) stock.curFx = fxMap['KR'];

                const newPrice = await fetchStockQuote(stock.code, stock.market);
                if (newPrice !== null && newPrice > 0) {
                    stock.curPrice = newPrice;
                    updatedCount++;
                }
            }

            saveData();
            renderApp();

            btn.disabled = false;
            icon.classList.remove('fa-spin');

            if (updatedCount === total) {
                showToast(`全 ${updatedCount} 件の株価・為替を更新しました`);
            } else if (updatedCount > 0) {
                showToast(`${updatedCount}/${total} 件を更新しました（失敗した項目は手動編集可）`, 'warning');
            } else {
                showToast('株価の自動更新に失敗しました。手動で直接編集可能です', 'error');
            }
        }

        function openBackupModal() { openModal('modal-backup'); }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `yumekabu_backup_${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('JSONデータをダウンロードしました');
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && Array.isArray(imported.holdings) && Array.isArray(imported.soldHistory)) {
                        appData = imported;
                        saveData();
                        renderApp();
                        closeModal('modal-backup');
                        showToast('復元が完了しました');
                    } else {
                        showToast('無効なファイル形式です', 'error');
                    }
                } catch (err) {
                    showToast('読み込みに失敗しました', 'error');
                }
            };
            reader.readAsText(file);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-900 border-blue-500 text-blue-300';
            let iconClass = 'fa-circle-check text-emerald-400';

            if (type === 'error') {
                bgClass = 'bg-slate-900 border-rose-500 text-rose-300';
                iconClass = 'fa-circle-exclamation text-rose-400';
            } else if (type === 'warning') {
                bgClass = 'bg-slate-900 border-amber-500 text-amber-300';
                iconClass = 'fa-triangle-exclamation text-amber-400';
            }

            toast.className = `pointer-events-auto flex items-center gap-2 px-3 py-2 rounded-xl border shadow-2xl backdrop-blur text-xs font-semibold transform transition-all duration-300 translate-y-4 opacity-0 ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${iconClass} text-sm shrink-0"></i> <span>${escapeHTML(message)}</span>`;

            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
